name: Weather signal archive

# ROADMAP item #3 (weather markets): archive the official NWS point forecast
# several times a day so a weather strategy can only ever read the forecast
# that existed AT DECISION TIME (no archive = no honest test; a re-fetched
# "forecast" for a past date is a lookahead).
#
# WHAT IT WRITES: data/forecasts/<location>.json — append-only snapshots, each
# with captured_at, the api.weather.gov URLs, and one row per forecast day
# (local date, forecast high °F). Bounded to the newest 1000 snapshots per
# location with a trims[] ledger, exactly like the candlestick store.
#
# WHY A WORKFLOW: api.weather.gov is not reachable from the build sandbox
# (only github.com egress works there). GitHub-hosted runners have
# unrestricted egress, so this is where the capture can actually run.
#
# TRIGGER: every 3 hours on schedule, plus any push that changes
# .github/triggers/forecast.json (the same commit-to-request pattern as the
# ingest workflow — the automation token cannot create workflow_dispatch
# events, but it can commit a file).

on:
  schedule:
    # Five captures/day spread across the NY weather-trading day (UTC).
    - cron: '23 1,7,13,19,23 * * *'
  push:
    paths:
      - '.github/triggers/forecast.json'

# Shared per-ref queue with the other data bots (ingest, FDA signals): one
# merge push can fire two bots whose regenerate steps rewrite the same browser
# modules. Queue, don't race (see ingest-now.yml).
concurrency:
  # ONE shared queue for every workflow that pushes to this repository:
  # daily-history, ingest-now and the six 20-minute signal archives (espn,
  # fda, form4, mlb-pregame, mlb, weather).
  #
  # Why `queue: max` instead of the default — GitHub's own documentation
  # (retrieved 2026-09-22,
  #  https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency):
  #   "single (default): At most one job or workflow run can be pending in the
  #    concurrency group. When a new job or workflow run is queued, any existing
  #    pending job or workflow run in the same group is canceled and replaced."
  #   "max: Up to 100 jobs or workflow runs can be pending in the concurrency
  #    group." (processed FIFO, by the time each started waiting)
  # The 20-minute archives used to sit in their OWN groups precisely to avoid
  # that eviction — which left them racing the shared group at the push step
  # instead. On 2026-09-22 three runs did exactly that and LOST their captures:
  # weather 35676454906 (queued 01:37:44Z) and mlb-pregame 35676725049 +
  # 35676946549 all finished capture/audit/regenerate and then FAILED at their
  # commit step ("remote moved under us"), so the data died with the runner
  # (irregularity #63). `queue: max` removes the trade-off: everybody queues,
  # nobody is evicted, nobody races.
  #
  # cancel-in-progress stays false — "The combination of queue: max and
  # cancel-in-progress: true is not allowed" (same page), and cancelling a run
  # would discard a capture that already spent its rate budget.
  group: data-pipeline-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync with the branch tip (best-effort)
        continue-on-error: true
        run: |
          # A run that sat in the data-pipeline queue checked out the commit
          # the queue STARTED at; meanwhile the queue occupant (or a merge)
          # may have advanced the branch. Fast-forward onto the tip BEFORE
          # capturing: the capture reads the newest store, the generated
          # modules are regenerated from the newest data, and the push at the
          # end usually needs no rebase at all. Best-effort by design: if the
          # histories cannot fast-forward we proceed anyway and the race
          # guard handles the push (the queued-run race behind
          # irregularity #51).
          git fetch --deepen=100 origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"


      - name: Capture the point-in-time NWS forecast
        run: |
          set -o pipefail
          node scripts/archive-forecasts.mjs 2>&1 | tee forecast.log

      - name: Audit the forecast store (no network)
        run: |
          set -o pipefail
          node scripts/archive-forecasts.mjs --verify | tee -a forecast.log

      - name: Regenerate the browser-safe modules and the Pages bundle
        run: |
          set -o pipefail
          node scripts/generate-history-module.mjs | tee -a forecast.log
          node scripts/generate-desk-module.mjs | tee -a forecast.log
          node scripts/render-docs.js | tee -a forecast.log
          node build.js | tee -a forecast.log

      - name: Commit the new snapshots
        run: |
          # One shared, locally-tested implementation of "commit everything
          # this run changed and survive the push race with the ingest bot"
          # (test/workflow-race-guard.sh reproduces the races, including the
          # one that killed the first post-merge ingest run on 2026-09-18).
          BOT_NAME="kalshi-forecast-bot" \
          BOT_EMAIL="kalshi-forecast-bot@users.noreply.github.com" \
          bash scripts/push-with-race-guard.sh \
            "chore(forecasts): archive point-in-time NWS forecast $(date -u +%F' '%H:%M)" \
            "${GITHUB_REF_NAME}"

      # An incomplete capture must be visible on the run, not buried in the log:
      # the script writes the failure list into the request file it just commits.
      - name: Fail the run when a location did not capture
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const req = JSON.parse(fs.readFileSync('data/forecasts/_forecast-request.json', 'utf8'));
          const f = (req.last_run && req.last_run.failures) || [];
          if (f.length) {
            for (const x of f) console.error('::error::' + x.key + ' — ' + x.reason);
            process.exit(1);
          }
          console.log('all locations captured');
          "

      # Insurance for the failure mode that lost the 2026-09-19 21:2x capture
      # (irregularity #51): if the COMMIT step still dies after all guards, the
      # freshly captured snapshots must not die with the runner. A failure-time
      # artifact costs a few hundred KB and makes the lost-data class of bug
      # recoverable by hand instead of unrecoverable.
      - name: Keep the captured snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-store-${{ github.run_id }}
          path: data/forecasts/
          if-no-files-found: warn
