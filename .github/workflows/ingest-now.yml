name: On-demand Kalshi history ingest

# WHY THIS WORKFLOW EXISTS
# ------------------------
# `daily-history.yml` is scheduled and can also be started with
# `workflow_dispatch` — but the GitHub App token this repository is automated
# with is NOT permitted to create workflow_dispatch events (HTTP 403 on
# /actions/workflows/{id}/dispatches), and the build sandbox cannot open TLS to
# *.kalshi.com (IRREGULARITIES.md #4). This workflow closes both gaps: an ingest
# is requested by COMMITTING `.github/triggers/ingest.json`, which is something
# the automation can always do, and the run itself happens on a GitHub-hosted
# runner with unrestricted egress.
#
# It runs on the branch that was pushed (unlike repository_dispatch, which always
# uses the default branch), so a feature branch can accumulate its own history.
#
# OFFICIAL ENDPOINTS USED (see scripts/ingest-history.mjs):
#   GET /series/{series_ticker}/markets/{ticker}/candlesticks
#     https://docs.kalshi.com/api-reference/market/get-market-candlesticks
#   GET /markets/{ticker}                 https://docs.kalshi.com/api-reference/market/get-market
#   GET /markets/{ticker}/orderbook       https://docs.kalshi.com/getting_started/orderbook_responses
#   GET /historical/cutoff                https://docs.kalshi.com/getting_started/historical_data

on:
  push:
    branches: ['**']
    paths:
      - '.github/triggers/ingest.json'
  workflow_dispatch:

# ONE INGEST AT A TIME PER BRANCH (irregularity #48).
# A second commit to .github/triggers/ingest.json while a run is fetching used
# to start a second run in parallel: the two then raced to commit to the same
# branch, and the automation token cannot cancel a run it started
# (`gh run cancel` → HTTP 403, no actions:write). With this group a later
# request waits for the run in flight (cancel-in-progress: false — never kill a
# fetch that already spent the exchange rate budget) instead of duplicating it.
concurrency:
  # ONE shared queue for every workflow that pushes to this repository:
  # daily-history, ingest-now and the six 20-minute signal archives (espn,
  # fda, form4, mlb-pregame, mlb, weather).
  #
  # Why `queue: max` instead of the default — GitHub's own documentation
  # (retrieved 2026-09-22,
  #  https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency):
  #   "single (default): At most one job or workflow run can be pending in the
  #    concurrency group. When a new job or workflow run is queued, any existing
  #    pending job or workflow run in the same group is canceled and replaced."
  #   "max: Up to 100 jobs or workflow runs can be pending in the concurrency
  #    group." (processed FIFO, by the time each started waiting)
  # The 20-minute archives used to sit in their OWN groups precisely to avoid
  # that eviction — which left them racing the shared group at the push step
  # instead. On 2026-09-22 three runs did exactly that and LOST their captures:
  # weather 35676454906 (queued 01:37:44Z) and mlb-pregame 35676725049 +
  # 35676946549 all finished capture/audit/regenerate and then FAILED at their
  # commit step ("remote moved under us"), so the data died with the runner
  # (irregularity #63). `queue: max` removes the trade-off: everybody queues,
  # nobody is evicted, nobody races.
  #
  # cancel-in-progress stays false — "The combination of queue: max and
  # cancel-in-progress: true is not allowed" (same page), and cancelling a run
  # would discard a capture that already spent its rate budget.
  group: data-pipeline-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync with the branch tip (best-effort)
        continue-on-error: true
        run: |
          # A run that sat in the data-pipeline queue checked out the commit
          # the queue STARTED at; meanwhile the queue occupant (or a merge)
          # may have advanced the branch. Fast-forward onto the tip BEFORE
          # capturing: the capture reads the newest store, the generated
          # modules are regenerated from the newest data, and the push at the
          # end usually needs no rebase at all. Best-effort by design: if the
          # histories cannot fast-forward we proceed anyway and the race
          # guard handles the push (the queued-run race behind
          # irregularity #51).
          git fetch --deepen=100 origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"


      - name: Read the request
        id: req
        run: |
          node -e '
            const fs = require("fs");
            const t = JSON.parse(fs.readFileSync(".github/triggers/ingest.json", "utf8"));
            if (t.enabled === false) { console.log("enabled=false — nothing requested"); process.exit(0); }
            const args = [
              "--days=" + (t.days ?? 90),
              "--with-books=" + (t.with_books ? "true" : "false"),
              "--with-market=" + (t.with_market === false ? "false" : "true"),
              "--min-volume=" + (t.min_volume ?? 0),
              "--max-markets=" + (t.max_markets ?? 0),
              (t.full_backfill ? "--full-backfill" : "--no-full-backfill")
            ];
            if (Array.isArray(t.series) && t.series.length) args.push("--series=" + t.series.join(","));
            if (Array.isArray(t.tickers) && t.tickers.length) args.push("--tickers=" + t.tickers.join(","));
            fs.writeFileSync(process.env.GITHUB_OUTPUT, "args=" + args.join(" ") + "\n");
            // Discovery (universe / series fees / keyword matches) is optional
            // and configured by the same trigger file:
            //   "discover": true | { "keywords": [...], "max_series": 60, ... }
            const d = t.discover === true ? {} : (t.discover && typeof t.discover === "object" ? t.discover : null);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "discover=" + (d ? "true" : "false") + "\n");
            if (d) {
              const dargs = [];
              if (Array.isArray(d.keywords) && d.keywords.length) dargs.push("--keywords=" + d.keywords.join(","));
              if (Array.isArray(d.series) && d.series.length) dargs.push("--series=" + d.series.join(","));
              if (d.max_series !== undefined) dargs.push("--max-series=" + d.max_series);
              if (d.top_markets !== undefined) dargs.push("--top-markets=" + d.top_markets);
              if (d.min_volume !== undefined) dargs.push("--min-volume=" + d.min_volume);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "discover_args=" + dargs.join(" ") + "\n");
              console.log("requested discovery args: " + dargs.join(" "));
            }
            console.log("requested args: " + args.join(" "));
          '

      - name: Ingest the latest real candlesticks
        run: |
          # pipefail: without it `node ... | tee` reports success even when the
          # script exits non-zero, which is exactly how a crash hid for a run.
          set -o pipefail
          node scripts/ingest-history.mjs ${{ steps.req.outputs.args }} 2>&1 | tee ingest.log

      # What exists on the exchange RIGHT NOW: every series with its real fee
      # configuration, plus the real markets of every series whose ticker /
      # title / tags match the requested keywords. Closes IRREGULARITY #36
      # (KXHIGHNY / KXGOLD15M fee multipliers were never captured) and answers
      # "which sports / FDA / weather series can honestly be traded and settled".
      - name: Discover the tradeable universe (official GET /series + /markets)
        if: steps.req.outputs.discover == 'true'
        run: |
          set -o pipefail
          node scripts/discover-universe.mjs ${{ steps.req.outputs.discover_args }} 2>&1 | tee -a ingest.log

      - name: Audit the store (no network)
        run: node scripts/ingest-history.mjs --verify | tee -a ingest.log

      - name: Regenerate the browser-safe modules and the Pages bundle
        run: |
          set -o pipefail
          node scripts/generate-history-module.mjs | tee -a ingest.log
          node scripts/generate-desk-module.mjs | tee -a ingest.log
          node scripts/render-docs.js | tee -a ingest.log
          node build.js | tee -a ingest.log

      # Store vs. exchange, bar by bar. Re-fetches stored windows from the
      # official endpoint and compares them FIELD-FOR-FIELD with stableEqual().
      # A disagreement fails the step, so a drifted store cannot be committed
      # quietly. (Runs only on a runner with egress — the build sandbox cannot
      # open TLS to *.kalshi.com, IRREGULARITIES.md #4.)
      - name: Verify the stored bars against the live API (deep comparison)
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/verify-store-live.mjs --markets=6 --windows=2 | tee -a ingest.log
          echo "live_verify_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        id: live_verify

      - name: Verify the intraday store against the live API
        continue-on-error: true
        run: node scripts/verify-store-live.mjs --period=60 --markets=4 --windows=2 --bars-per-window=24 | tee -a ingest.log

      - name: Check whether the tracked markets have settled
        run: node scripts/track-settlements.mjs --write | tee -a ingest.log
        continue-on-error: true

      - name: Audit the game-window captures (no network)
        # ROADMAP "Next #1": did a with_books run ever store a NON-EMPTY ladder
        # for a game-series contract WHILE the game was being played? The audit
        # reads only committed files — data/history/**, the official MLB archive
        # (statsapi.mlb.com) and the ESPN archive (trusted, NOT official) — and
        # writes data/reports/game-window-captures.json plus the compact copy the
        # Pages site links. It never guesses an event window: a ladder inside the
        # tradeable window that cannot be joined is reported as
        # TRADEABLE_EVENT_UNVERIFIED, never as in-play (irregularities #60, #65).
        # continue-on-error: an audit FINDING must never mask an ingest failure —
        # the verdict travels in the committed report and in the step log.
        continue-on-error: true
        run: node scripts/verify-game-window.mjs | tee -a ingest.log

      - name: Keep the run log with the data
        if: always()
        run: cp ingest.log data/history/_last-run.log

      - name: Commit the new history
        run: |
          du -sh data/history 2>/dev/null || true
          du -sh data/history/intraday 2>/dev/null || true
          du -sh data/discovered 2>/dev/null || true
          # One shared, locally-tested implementation of "commit everything
          # this run changed and survive the push race with the forecast bot".
          # The inline version here lost a full ingest on 2026-09-18 by
          # forgetting src/forecast-data.js in `git add` (rebase then refused
          # to start; `git rebase --abort` exited 128 under bash -e and killed
          # the step) — see IRREGULARITIES.md #41 and
          # test/workflow-race-guard.sh, which reproduces that exact race.
          bash scripts/push-with-race-guard.sh \
            "chore(history): append real Kalshi candlesticks $(date -u +%F)" \
            "${GITHUB_REF_NAME}"

      - name: Upload the ingest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log-${{ github.run_number }}
          path: ingest.log
          if-no-files-found: warn
