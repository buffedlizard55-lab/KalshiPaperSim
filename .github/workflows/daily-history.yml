name: Daily Kalshi history ingest

# Recommended-work item #1: grow a genuine multi-month dataset, one day at a
# time, from the official Kalshi API.
#
# WHY A WORKFLOW: the build sandbox cannot open TLS connections to
# *.kalshi.com (IRREGULARITIES.md #4). GitHub-hosted runners have unrestricted
# egress, so this is where the daily append can actually run.
#
# WHAT IT WRITES: data/history/<ticker>.json (merged, never overwritten) and
# data/history/_manifest.json (counts, source URLs, conflicts). The job commits
# only when something changed, so a no-op day produces no commit.
#
# OFFICIAL ENDPOINTS USED (see scripts/ingest-history.mjs):
#   GET /series/{series_ticker}/markets/{ticker}/candlesticks
#     https://docs.kalshi.com/api-reference/market/get-market-candlesticks
#   GET /markets/{ticker}/orderbook
#     https://docs.kalshi.com/getting_started/orderbook_responses

on:
  schedule:
    # 06:15 UTC — after the daily Kalshi session boundary, before US hours.
    - cron: '15 6 * * *'
    # 16:40 UTC — mid-US-trading-day pass that ALSO captures an order-book
    # snapshot per tracked market (ROADMAP "Captured depth on every fill":
    # repeated with_books captures make the quoted touch point-in-time, not
    # just the single ladder captured by the last on-demand run). The flag is
    # derived from the triggering cron below — schedule events cannot pass
    # workflow_dispatch inputs.
    - cron: '40 16 * * *'
  workflow_dispatch:
    inputs:
      with_books:
        description: 'Also capture an order-book snapshot per market'
        required: false
        default: 'false'
      days:
        description: 'Backfill window in days when the store is empty'
        required: false
        default: '90'
      series:
        description: 'Comma-separated series to discover liquid markets in (e.g. KXNASDAQ100Y,KXBTCY,KXINXY)'
        required: false
        default: 'KXNASDAQ100Y,KXBTCY,KXINXY'
      min_volume:
        description: 'Minimum lifetime contract volume for a discovered market to be tracked'
        required: false
        default: '20000'
      max_markets:
        description: 'Cap on newly discovered markets per run (0 = no cap)'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ingest the latest real candlesticks
        id: ingest
        run: |
          # workflow_dispatch passes with_books explicitly; the 16:40 UTC
          # scheduled pass captures order books (see the cron comment above);
          # every other trigger does not.
          WITH_BOOKS="${{ github.event.inputs.with_books }}"
          if [ -z "${WITH_BOOKS}" ]; then
            if [ "${{ github.event.schedule }}" = "40 16 * * *" ]; then
              WITH_BOOKS=true
            else
              WITH_BOOKS=false
            fi
          fi
          ARGS="--with-books=${WITH_BOOKS} --days=${{ github.event.inputs.days || '90' }}"
          if [ -n "${{ github.event.inputs.series }}" ]; then
            ARGS="$ARGS --series=${{ github.event.inputs.series }}"
          else
            ARGS="$ARGS --series=KXNASDAQ100Y,KXBTCY,KXINXY"
          fi
          ARGS="$ARGS --min-volume=${{ github.event.inputs.min_volume || '20000' }} --max-markets=${{ github.event.inputs.max_markets || '10' }}"
          node scripts/ingest-history.mjs $ARGS | tee ingest.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Audit the store (no network)
        run: node scripts/ingest-history.mjs --verify | tee -a ingest.log

      - name: Check whether the tracked markets have settled
        run: node scripts/track-settlements.mjs --write | tee -a ingest.log
        continue-on-error: true

      - name: Commit the new history
        run: |
          # Regenerate the browser-safe modules so the deployed site carries
          # today's bars without waiting for the next forecast-archive run
          # (that run regenerates them too — the script is deterministic).
          node scripts/generate-history-module.mjs | tee -a ingest.log
          # One shared, locally-tested implementation of "commit everything
          # this run changed and survive the push race with the forecast bot"
          # (test/workflow-race-guard.sh reproduces the races, including the
          # one that killed the first post-merge run on 2026-09-18).
          bash scripts/push-with-race-guard.sh \
            "chore(history): append real Kalshi candlesticks $(date -u +%F)" \
            "${GITHUB_REF_NAME}"

      - name: Upload the ingest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log
          path: ingest.log
          if-no-files-found: warn
