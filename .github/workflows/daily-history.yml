name: Daily Kalshi history ingest

# Recommended-work item #1: grow a genuine multi-month dataset, one day at a
# time, from the official Kalshi API.
#
# WHY A WORKFLOW: the build sandbox cannot open TLS connections to
# *.kalshi.com (IRREGULARITIES.md #4). GitHub-hosted runners have unrestricted
# egress, so this is where the daily append can actually run.
#
# WHAT IT WRITES: data/history/<ticker>.json (merged, never overwritten) and
# data/history/_manifest.json (counts, source URLs, conflicts). The job commits
# only when something changed, so a no-op day produces no commit.
#
# OFFICIAL ENDPOINTS USED (see scripts/ingest-history.mjs):
#   GET /series/{series_ticker}/markets/{ticker}/candlesticks
#     https://docs.kalshi.com/api-reference/market/get-market-candlesticks
#   GET /markets/{ticker}/orderbook
#     https://docs.kalshi.com/getting_started/orderbook_responses

on:
  schedule:
    # 06:15 UTC — after the daily Kalshi session boundary, before US hours.
    - cron: '15 6 * * *'
    # 16:40 UTC — mid-US-trading-day pass that ALSO captures an order-book
    # snapshot per tracked market (ROADMAP "Captured depth on every fill":
    # repeated with_books captures make the quoted touch point-in-time, not
    # just the single ladder captured by the last on-demand run). The flag is
    # derived from the triggering cron below — schedule events cannot pass
    # workflow_dispatch inputs.
    - cron: '40 16 * * *'
    # 00:30 + 02:30 UTC — LIVE-GAME-WINDOW passes (ROADMAP Next #10,
    # 2026-09-21): MLB evening games and NBA/NHL games are IN PLAY at these
    # hours, so a with_books capture here stores a REAL, NON-EMPTY ladder for
    # KXMLBGAME / KXNFLGAME / KXNBAGAME / KXNHLGAME / KXNCAAFGAME contracts.
    # The 06:15 + 16:40 runs captured these books only after settlement and
    # the exchange returns an empty orderbook then — every stored game ladder
    # before this change had zero levels, which is why the desk's game-series
    # reserves kept 0 tradeable slots. These runs fix the CAPTURE TIMING, not
    # the capture code.
    - cron: '30 0 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      with_books:
        description: 'Also capture an order-book snapshot per market'
        required: false
        default: 'false'
      days:
        description: 'Backfill window in days when the store is empty'
        required: false
        default: '90'
      series:
        description: 'Comma-separated series to discover liquid markets in (e.g. KXNASDAQ100Y,KXBTCY,KXINXY)'
        required: false
        default: 'KXNASDAQ100Y,KXBTCY,KXINXY'
      min_volume:
        description: 'Minimum lifetime contract volume for a discovered market to be tracked'
        required: false
        default: '20000'
      max_markets:
        description: 'Cap on newly discovered markets per run (0 = no cap)'
        required: false
        default: '10'

# SHARED per-ref queue with the other data bots (on-demand ingest, FDA
# signals, weather signals) — the same group they use (see ingest-now.yml).
# This cron ALSO pushes (it commits the new bars), so running it outside the
# queue defeats the whole point of the queue: a concurrent push is exactly
# what killed the 2026-09-19 weather capture mid-commit (irregularity #51).
# cancel-in-progress: false — never kill a fetch that already spent its rate
# budget.
concurrency:
  # ONE shared queue for every workflow that pushes to this repository:
  # daily-history, ingest-now and the six 20-minute signal archives (espn,
  # fda, form4, mlb-pregame, mlb, weather).
  #
  # Why `queue: max` instead of the default — GitHub's own documentation
  # (retrieved 2026-09-22,
  #  https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency):
  #   "single (default): At most one job or workflow run can be pending in the
  #    concurrency group. When a new job or workflow run is queued, any existing
  #    pending job or workflow run in the same group is canceled and replaced."
  #   "max: Up to 100 jobs or workflow runs can be pending in the concurrency
  #    group." (processed FIFO, by the time each started waiting)
  # The 20-minute archives used to sit in their OWN groups precisely to avoid
  # that eviction — which left them racing the shared group at the push step
  # instead. On 2026-09-22 three runs did exactly that and LOST their captures:
  # weather 35676454906 (queued 01:37:44Z) and mlb-pregame 35676725049 +
  # 35676946549 all finished capture/audit/regenerate and then FAILED at their
  # commit step ("remote moved under us"), so the data died with the runner
  # (irregularity #63). `queue: max` removes the trade-off: everybody queues,
  # nobody is evicted, nobody races.
  #
  # cancel-in-progress stays false — "The combination of queue: max and
  # cancel-in-progress: true is not allowed" (same page), and cancelling a run
  # would discard a capture that already spent its rate budget.
  group: data-pipeline-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync with the branch tip (best-effort)
        continue-on-error: true
        run: |
          # A run that sat in the data-pipeline queue checked out the commit
          # the queue STARTED at; meanwhile the queue occupant (or a merge)
          # may have advanced the branch. Fast-forward onto the tip BEFORE
          # capturing: the capture reads the newest store, the generated
          # modules are regenerated from the newest data, and the push at the
          # end usually needs no rebase at all. Best-effort by design: if the
          # histories cannot fast-forward we proceed anyway and the race
          # guard handles the push (the queued-run race behind
          # irregularity #51).
          git fetch --deepen=100 origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"


      - name: Ingest the latest real candlesticks
        id: ingest
        run: |
          # workflow_dispatch passes with_books explicitly; the 16:40 UTC
          # (mid-day) and 00:30 / 02:30 UTC (live-game-window) scheduled
          # passes capture order books (see the cron comments above); every
          # other trigger does not.
          WITH_BOOKS="${{ github.event.inputs.with_books }}"
          if [ -z "${WITH_BOOKS}" ]; then
            case "${{ github.event.schedule }}" in
              "40 16 * * *"|"30 0 * * *"|"30 2 * * *") WITH_BOOKS=true ;;
              *) WITH_BOOKS=false ;;
            esac
          fi
          ARGS="--with-books=${WITH_BOOKS} --days=${{ github.event.inputs.days || '90' }}"
          if [ -n "${{ github.event.inputs.series }}" ]; then
            ARGS="$ARGS --series=${{ github.event.inputs.series }}"
          else
            ARGS="$ARGS --series=KXNASDAQ100Y,KXBTCY,KXINXY"
          fi
          ARGS="$ARGS --min-volume=${{ github.event.inputs.min_volume || '20000' }} --max-markets=${{ github.event.inputs.max_markets || '10' }}"
          node scripts/ingest-history.mjs $ARGS | tee ingest.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Audit the store (no network)
        run: node scripts/ingest-history.mjs --verify | tee -a ingest.log

      - name: Check whether the tracked markets have settled
        run: node scripts/track-settlements.mjs --write | tee -a ingest.log
        continue-on-error: true

      - name: Audit the game-window captures (no network)
        # ROADMAP "Next #1": did a with_books run ever store a NON-EMPTY ladder
        # for a game-series contract WHILE the game was being played? The audit
        # reads only committed files — data/history/**, the official MLB archive
        # (statsapi.mlb.com) and the ESPN archive (trusted, NOT official) — and
        # writes data/reports/game-window-captures.json plus the compact copy the
        # Pages site links. It never guesses an event window: a ladder inside the
        # tradeable window that cannot be joined is reported as
        # TRADEABLE_EVENT_UNVERIFIED, never as in-play (irregularities #60, #65).
        # continue-on-error: an audit FINDING must never mask an ingest failure —
        # the verdict travels in the committed report and in the step log.
        continue-on-error: true
        run: node scripts/verify-game-window.mjs | tee -a ingest.log

      - name: Commit the new history
        run: |
          # Regenerate every browser-safe module AND the Pages bundle so the
          # deployed site carries today's bars, today's captured ladders and
          # the rebuilt desk report without waiting for a local build. All of
          # these are deterministic: only `generatedAt` and the new data change.
          node scripts/generate-history-module.mjs | tee -a ingest.log
          node scripts/generate-desk-module.mjs | tee -a ingest.log
          node scripts/render-docs.js | tee -a ingest.log
          node build.js | tee -a ingest.log
          # One shared, locally-tested implementation of "commit everything
          # this run changed and survive the push race with the forecast bot"
          # (test/workflow-race-guard.sh reproduces the races, including the
          # one that killed the first post-merge run on 2026-09-18).
          bash scripts/push-with-race-guard.sh \
            "chore(history): append real Kalshi candlesticks $(date -u +%F)" \
            "${GITHUB_REF_NAME}"

      - name: Upload the ingest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log
          path: ingest.log
          if-no-files-found: warn
