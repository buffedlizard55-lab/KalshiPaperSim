name: FDA signal archive

# ROADMAP item "a point-in-time signal archive for a sports or FDA project"
# (the FDA half): archive the official Drugs@FDA state of every drug the
# tracked KXFDA* markets resolve on, several times a day, so an FDA strategy
# can only ever read the state that existed AT DECISION TIME (no archive = no
# honest test; re-reading today's database for a past decision is a lookahead,
# because the database is re-read, not re-run).
#
# WHAT IT WRITES: data/fda-signals/<slug>.json — append-only snapshots, each
# with captured_at, the api.fda.gov URL, the verbatim meta block
# (disclaimer / last_updated / total), the derived state and the verbatim
# marketing_status strings the derivation came from. Bounded to the newest
# 2000 snapshots per subject with a trims[] ledger, exactly like the
# candlestick and forecast stores.
#
# WHY A WORKFLOW: api.fda.gov is not reachable from the build sandbox
# (only github.com egress works there). GitHub-hosted runners have
# unrestricted egress, so this is where the capture can actually run.
#
# TRIGGER: four captures/day on schedule (spread across the US FDA day), plus
# any push that changes .github/triggers/fda.json (the same commit-to-request
# pattern as the forecast and ingest workflows).

on:
  schedule:
    # 12:10 / 16:10 / 20:10 / 00:10 UTC — early morning, midday, afternoon and
    # evening in US Eastern time, so an approval announced any time during the
    # FDA's working day is captured the same day.
    - cron: '10 0,12,16,20 * * *'
  push:
    paths:
      - '.github/triggers/fda.json'
  workflow_dispatch:

# Shared per-ref queue with the other data bots (ingest, weather signals):
# one merge push can fire two bots whose regenerate steps rewrite the same
# browser modules. Queue, don't race (see ingest-now.yml).
concurrency:
  # ONE shared queue for every workflow that pushes to this repository:
  # daily-history, ingest-now and the six 20-minute signal archives (espn,
  # fda, form4, mlb-pregame, mlb, weather).
  #
  # Why `queue: max` instead of the default — GitHub's own documentation
  # (retrieved 2026-09-22,
  #  https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency):
  #   "single (default): At most one job or workflow run can be pending in the
  #    concurrency group. When a new job or workflow run is queued, any existing
  #    pending job or workflow run in the same group is canceled and replaced."
  #   "max: Up to 100 jobs or workflow runs can be pending in the concurrency
  #    group." (processed FIFO, by the time each started waiting)
  # The 20-minute archives used to sit in their OWN groups precisely to avoid
  # that eviction — which left them racing the shared group at the push step
  # instead. On 2026-09-22 three runs did exactly that and LOST their captures:
  # weather 35676454906 (queued 01:37:44Z) and mlb-pregame 35676725049 +
  # 35676946549 all finished capture/audit/regenerate and then FAILED at their
  # commit step ("remote moved under us"), so the data died with the runner
  # (irregularity #63). `queue: max` removes the trade-off: everybody queues,
  # nobody is evicted, nobody races.
  #
  # cancel-in-progress stays false — "The combination of queue: max and
  # cancel-in-progress: true is not allowed" (same page), and cancelling a run
  # would discard a capture that already spent its rate budget.
  group: data-pipeline-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync with the branch tip (best-effort)
        continue-on-error: true
        run: |
          # A run that sat in the data-pipeline queue checked out the commit
          # the queue STARTED at; meanwhile the queue occupant (or a merge)
          # may have advanced the branch. Fast-forward onto the tip BEFORE
          # capturing: the capture reads the newest store, the generated
          # modules are regenerated from the newest data, and the push at the
          # end usually needs no rebase at all. Best-effort by design: if the
          # histories cannot fast-forward we proceed anyway and the race
          # guard handles the push (the queued-run race behind
          # irregularity #51).
          git fetch --deepen=100 origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"


      - name: Capture the point-in-time Drugs@FDA state
        run: |
          set -o pipefail
          node scripts/archive-fda-signals.mjs 2>&1 | tee fda-signals.log

      - name: Audit the FDA signal store (no network)
        run: |
          set -o pipefail
          node scripts/archive-fda-signals.mjs --verify | tee -a fda-signals.log

      - name: Regenerate the browser-safe modules and the Pages bundle
        run: |
          set -o pipefail
          node scripts/generate-history-module.mjs | tee -a fda-signals.log
          node scripts/generate-desk-module.mjs | tee -a fda-signals.log
          node scripts/render-docs.js | tee -a fda-signals.log
          node build.js | tee -a fda-signals.log

      - name: Commit the new snapshots
        if: always()
        run: |
          # Runs even after a failed capture so the run report
          # (data/fda-signals/_fda-last-run.json, with the per-subject HTTP
          # errors) is committed and diagnosable from the repository itself —
          # runner log archives are not readable from every environment this
          # project is developed in. The capture step exits non-zero on
          # failures; the final step below fails the RUN so the failure stays
          # visible on the run. One shared, locally-tested implementation of
          # "commit everything this run changed and survive the push race with
          # the other bots" (test/workflow-race-guard.sh).
          BOT_NAME="kalshi-fda-bot" \
          BOT_EMAIL="kalshi-fda-bot@users.noreply.github.com" \
          bash scripts/push-with-race-guard.sh \
            "chore(fda-signals): archive point-in-time Drugs@FDA state $(date -u +%F' '%H:%M)" \
            "${GITHUB_REF_NAME}"

      - name: Upload the capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fda-signals-log
          path: fda-signals.log
          if-no-files-found: warn

      # Same insurance as the weather archive: a dead commit step must not
      # take fresh captures with it (irregularity #51).
      - name: Keep the captured snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fda-signal-store-${{ github.run_id }}
          path: data/fda-signals/
          if-no-files-found: warn

      # An incomplete capture must be visible on the run, not buried in the
      # log: the script writes per-subject errors into
      # data/fda-signals/_fda-last-run.json (the same pattern the forecast
      # workflow uses with its request file).
      - name: Fail the run when a subject did not capture
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('data/fda-signals/_fda-last-run.json')) { console.log('no run report — nothing to evaluate'); process.exit(0); }
          const rep = JSON.parse(fs.readFileSync('data/fda-signals/_fda-last-run.json', 'utf8'));
          const f = (rep.subjects || []).filter((s) => !s.ok);
          if (f.length || rep.failures) {
            for (const x of f) console.error('::error::' + x.slug + ' — ' + (x.error || 'unknown error'));
            process.exit(1);
          }
          console.log('all ' + (rep.subjects || []).length + ' subjects captured');
          "
